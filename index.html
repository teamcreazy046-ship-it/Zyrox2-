function admin(){const T=isOwner()?[['clientes','Clientes'],['pedidos','Pedidos'],['ofertas','Ofertas'],['ajustes','Ajustes']]:[['pedidos','Pedidos'],['ajustes','Ajustes']];if(!T.find(t=>t[0]==S.tab))S.tab='pedidos';
return`<h2>${ic('shield',22)} Panel Admin</h2><div class="tabs">${T.map(([k,n])=>`<button class="btn sm ${S.tab==k?'':'g'}" onclick="S.tab='${k}';render()">${n}</button>`).join('')}</div>`+({clientes:cli,pedidos:ped,ofertas:ofe,ajustes:aju}[S.tab])()}
function cli(){return C.users.map(u=>{const ad=C.admins.some(a=>a.phone==u.id);return`<div class="card"><div class="row"><div><b>${esc(u.name)}</b> ${u.banned?'<span class="st rejected">Baneado</span>':''}<div class="mu">${u.id} · ${C.orders.filter(o=>o.uid==u.id&&o.status=='done').length} recargas · ${C.orders.filter(o=>o.uid==u.id).length} pedidos</div></div>${u.id==OWNER?`<span style="color:#ffc84d">${ic('crown',22)}</span>`:`<div class="row"><button class="btn sm g" onclick="A.mk('${u.id}')">${ad?'Quitar admin':'Poner admin'}</button><button class="btn sm ${u.banned?'ok':'no'}" onclick="A.ban('${u.id}')">${u.banned?'Desbanear':'Banear'}</button></div>`}</div></div>`}).join('')||'<div class="card mu">Sin clientes</div>'}
function ped(){const my=o=>isOwner()||myAdm()&&o.aid==myAdm().id;const L=C.orders.filter(my),td=new Date().toDateString(),dn=L.filter(o=>o.status=='done'),dt=dn.filter(o=>new Date(o.id).toDateString()==td);const pend=L.filter(o=>o.status=='pending'||o.status=='open');
return`<div class="grid"><div class="card" style="text-align:center"><b style="font-size:28px">${dt.length}</b><div class="mu">Entregadas hoy</div></div><div class="card" style="text-align:center"><b style="font-size:28px">${dn.length}</b><div class="mu">Entregadas total</div></div></div><div class="card mu">Hoy: ${fmt(dt.reduce((s,o)=>s+o.d,0))} · Hoy: ${fmt(dt.reduce((s,o)=>s+o.p,0))} saldo</div><h3>Pendientes (${pend.length})</h3>`+row(pend)+`<h3 style="margin-top:12px">Historial</h3>`+row(L.filter(o=>o.status=='done'||o.status=='rejected').sort((a,b)=>b.id-a.id).slice(0,40))}
function row(l){return l.map(o=>`<div class="card row" style="cursor:pointer" onclick="go('chat',{oid:${o.id},asA:true})"><div><b>${esc(o.uname)}</b> · ${ic('gem',15)} ${fmt(o.d)}<div class="mu">${esc(o.aname)} · ${new Date(o.id).toLocaleString()}</div></div><span class="st ${o.status}">${stTxt(o)}</span></div>`).join('')||'<div class="card mu">Nada por aquí</div>'}
function ofe(){return C.games.map((g,gi)=>`<div class="card"><input value="${esc(g.name)}" onchange="A.eg(${gi},'name',this.value)" placeholder="Nombre del juego"><div class="row"><input style="flex:1" value="${esc(g.img.startsWith('data:')?'(imagen subida)':g.img)}" onchange="A.eg(${gi},'img',this.value)" placeholder="URL de imagen"><label class="btn sm g">Subir<input type="file" accept="image/*" hidden onchange="A.up(${gi},this)"></label></div>
${g.offers.map((o,oi)=>`<div class="row" style="flex-wrap:nowrap">${ic('gem',18)}<input type="number" value="${o.d}" onchange="A.eo(${gi},${oi},'d',this.value)">${ic('phone',18)}<input type="number" value="${o.p}" onchange="A.eo(${gi},${oi},'p',this.value)"><button class="btn sm no" onclick="A.do(${gi},${oi})">${ic('x',14)}</button></div>`).join('')}
<div class="row" style="margin-top:8px"><button class="btn sm g" onclick="A.ao(${gi})">+ Oferta</button><button class="btn sm no" onclick="A.dg(${gi})">Eliminar juego</button></div></div>`).join('')+`<button class="btn" style="width:100%" onclick="A.ag()">+ Añadir juego</button>`}
function aju(){const L=isOwner()?C.admins:C.admins.filter(a=>a.phone==S.u);return L.map(a=>`<div class="card"><div class="row"><b>${esc(a.name)} <span class="mu">(${a.phone})</span></b><button class="btn sm ${a.active?'ok':'g'}" onclick="A.act('${a.id}')">${a.active?'● Activo':'○ Inactivo'}</button></div><div class="mu" style="margin-top:6px">Número para recibir el saldo:</div><input type="tel" value="${a.pay}" onchange="A.pay('${a.id}',this.value)"></div>`).join('')||'<div class="card mu">No eres administrador.</div>'}
/* ACTIONS */
const A={
async auth(){const p=($('#p').value||'').replace(/\D/g,''),w=$('#w').value;if(!p||!w)return toast('Completa los campos');
if(S.auth=='login'){const u=C.users.find(x=>x.id==p&&x.pw==w);if(!u)return toast('Número o contraseña incorrectos');if(u.banned)return toast('Cuenta baneada ')}
else{const n=$('#n').value.trim();if(!n)return toast('Pon tu nombre');if(C.users.find(x=>x.id==p))return toast('Ese número ya existe');C.users.push({id:p,name:n,pw:w,banned:false,ts:Date.now()});await save('users')}
S.u=p;localStorage.setItem('zx_s',p);S.v='home';render();toast('¡Bienvenido a Zyrox! ')},
out(){S.u=null;localStorage.removeItem('zx_s');render()},
async pass(){const w=$('#w1').value;if(w.length<3)return toast('Muy corta');me().pw=w;await save('users');toast('Contraseña cambiada ')},
async open(aid){const g=C.games.find(x=>x.id==S.gid),f=g.offers[S.of],a=C.admins.find(x=>x.id==aid);const o={id:Date.now(),uid:S.u,uname:me().name,gname:g.name,d:f.d,p:f.p,aid,aname:a.name,step:0,status:'open',msgs:[]};C.orders.push(o);await save('orders');go('chat',{oid:o.id,asA:false})},
async push(o,f,m){o=ord(o.id)||o;o.msgs.push({f,ts:Date.now(),...m});await save('orders');rc()},
async bot(o,m,d=900){await sleep(d);await A.push(o,'a',m)},
async offer(i){const o=ord(i);o.step=1;await A.push(o,'u',{t:`Oferta seleccionada\nJuego: ${o.gname}\nDiamantes: ${fmt(o.d)}\nTotal: ${fmt(o.p)} Saldo Móvil`});render();await A.bot(o,{t:'¡Perfecto! Ahora mándame tu ID de Free Fire.'})},
async id(i){const o=ord(i),v=$('#tx').value.trim();if(!v)return;o.gid=v;o.step=2;await A.push(o,'u',{t:'Mi ID: '+v});render();const a=C.admins.find(x=>x.id==o.aid);
await A.bot(o,{t:`Datos de tu pedido\nJuego: ${o.gname}\nDiamantes: ${fmt(o.d)}\nID: ${v}\nTotal: ${fmt(o.p)} Saldo Móvil\n\nEnvía ${fmt(o.p)} de saldo al número:\n${a.pay}`,copy:a.pay});await A.bot(o,{t:'Cuando envíes el saldo, mándame la captura de la transferencia.'},700)},
async img(i,inp){const f=inp.files[0];if(!f)return;const o=ord(i),url=await new Promise(r=>{const im=new Image;im.onload=()=>{const k=Math.min(1,700/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};im.src=URL.createObjectURL(f)});
o.step=3;o.status='pending';await A.push(o,'u',{t:'Captura de transferencia',img:url});render();await A.bot(o,{t:`Tu recarga está en proceso\nJuego: ${o.gname}\nDiamantes: ${fmt(o.d)}\nID: ${o.gid}\nTotal: ${fmt(o.p)} saldo\n\nEl administrador la revisará en breve.`})},
async fin(i,ok){const o=ord(i);o.status=ok?'done':'rejected';o.step=4;if(ok)await A.push(o,'a',{t:`¡Tu compra ha sido completada!\nJuego: ${o.gname}\nDiamantes: ${fmt(o.d)}\nID: ${o.gid}\n\nÚnete a nuestro grupo de WhatsApp:`,link:'https://chat.whatsapp.com/DR7m3AV2calADstAQYj8A6?s=cl&p=a&mlu=4&ilr=4&iam=2'});else await A.push(o,'a',{t:`Tu pedido fue rechazado.\nDiamantes: ${fmt(o.d)} · ID: ${o.gid}\nSi crees que es un error, contáctanos por soporte.`});render()},
async say(i){const v=$('#tx').value.trim();if(!v)return;$('#tx').value='';await A.push(ord(i),'a',{t:v})},
copy(t){navigator.clipboard?.writeText(t);toast('Número copiado ')},
ref(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card" style="width:100%;max-width:400px"><h3>Deja tu referencia</h3><div class="stars" id="st">${[1,2,3,4,5].map(n=>`<span data-n="${n}" class="on">★</span>`).join('')}</div><input id="rt" placeholder="Tu comentario…"><div class="row"><button class="btn g" id="rx">Cancelar</button><button class="btn" id="rs">Enviar</button></div></div>`;document.body.append(m);let s=5;m.querySelectorAll('.stars span').forEach(e=>e.onclick=()=>{s=+e.dataset.n;m.querySelectorAll('.stars span').forEach(x=>x.classList.toggle('on',+x.dataset.n<=s))});
m.querySelector('#rx').onclick=()=>m.remove();m.querySelector('#rs').onclick=async()=>{C.refs.push({name:me().name,s,t:m.querySelector('#rt').value||'¡Excelente servicio!',ts:Date.now()});await save('refs');m.remove();toast('¡Gracias por tu referencia! ')}},
async act(id){const a=C.admins.find(x=>x.id==id);a.active=!a.active;await save('admins');render()},
async pay(id,v){C.admins.find(x=>x.id==id).pay=v.replace(/\D/g,'');await save('admins');toast('Número guardado ')},
async mk(ph){const a=C.admins.find(x=>x.phone==ph);if(a)C.admins=C.admins.filter(x=>x!=a);else C.admins.push({id:'a'+Date.now(),name:'Zyrox'+(C.admins.length+1),phone:ph,pay:ph,active:false});await save('admins');render()},
async ban(ph){const u=C.users.find(x=>x.id==ph);u.banned=!u.banned;await save('users');render()},
async eg(g,k,v){C.games[g][k]=v;await save('games')},async eo(g,o,k,v){C.games[g].offers[o][k]=+v;await save('games')},
async ao(g){C.games[g].offers.push({d:100,p:200});await save('games');render()},async do(g,o){C.games[g].offers.splice(o,1);await save('games');render()},
async ag(){C.games.push({id:'g'+Date.now(),name:'Nuevo juego',img:'',offers:[]});await save('games');render()},async dg(g){if(confirm('¿Eliminar juego?')){C.games.splice(g,1);await save('games');render()}},
up(g,inp){const f=inp.files[0];if(!f)return;const r=new FileReader;r.onload=async()=>{const im=new Image;im.onload=async()=>{const c=document.createElement('canvas');c.width=c.height=200;c.getContext('2d').drawImage(im,0,0,200,200);C.games[g].img=c.toDataURL('image/jpeg',.7);await save('games');render()};im.src=r.result};r.readAsDataURL(f)}};
/* BG PARTICLES */
(function(){const c=$('#bg'),x=c.getContext('2d');let W,H,P=[];const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();onresize=rs;for(let i=0;i<55;i++)P.push({x:Math.random()*2e3,y:Math.random()*2e3,r:Math.random()*2+.5,v:Math.random()*.5+.15,h:[340,260,190][i%3]});
(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.y-=p.v;if(p.y<0){p.y=H;p.x=Math.random()*W}x.fillStyle=`hsla(${p.h},100%,65%,.55)`;x.shadowBlur=12;x.shadowColor=`hsl(${p.h},100%,60%)`;x.beginPath();x.arc(p.x%W,p.y,p.r,0,7);x.fill()});requestAnimationFrame(f)})()})();
/* INIT */
(async function(){const hide=()=>{const e=$('#sp');if(!e)return;e.style.opacity=0;setTimeout(()=>e.remove(),800)};$('#spg').innerHTML=ic('gem',84);setTimeout(hide,4500);
try{await pull();if(SB_URL){if(PULLED)for(const k in D)if(!GOT.has(k))await save(k)}else for(const k in D)if(!localStorage.getItem('zx_d_'+k))await save(k);last=JSON.stringify(C);render()}catch(e){console.error(e);try{render()}catch(_){}}
setTimeout(hide,1300);
setInterval(async()=>{await pull();const n=JSON.stringify(C);if(n==last)return;last=n;if(S.v=='chat')rc();else if(!/INPUT|SELECT/.test(document.activeElement.tagName)&&!$('.modal'))render()},2500)})();
</script></body></html>
